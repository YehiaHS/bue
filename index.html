<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>BUE FCMM: Mass Communication as a Student-Run Media Outlet</title>
<meta name="description" content="Proposal deck for the Faculty of Communication and Mass Media, The British University in Egypt." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230A0A11'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --red:#ED1F2C; --indigo:#2B3C92; --indigo-hi:#8FA0E8; --ink:#0A0A11; --plum:#352D57;
    --paper:#FFFFFF; --cool:#CFD9DF; --gold:#E7B84B;
    --sans:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --lb:56px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#040409;overflow:hidden;
    font-family:var(--sans);
    color:#fff;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  canvas{display:block}
  #stage{position:fixed;inset:0}

  /* ---------- cinematic frame ---------- */
  .lb{position:fixed;left:0;right:0;height:var(--lb);z-index:8;pointer-events:none;
    background:#030308;transition:transform 1.1s cubic-bezier(.16,1,.3,1)}
  #lbT{top:0;transform:translateY(-100%)}
  #lbB{bottom:0;transform:translateY(100%)}
  .lb::after{content:"";position:absolute;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(237,31,44,.55) 18%,rgba(143,160,232,.55) 82%,transparent)}
  #lbT::after{bottom:0}
  #lbB::after{top:0}
  body.show #lbT{transform:none}
  body.show #lbB{transform:none}
  body.wide{--lb:0px}

  #scrimTop{position:fixed;top:0;left:0;right:0;height:170px;z-index:7;pointer-events:none;
    background:linear-gradient(180deg,rgba(3,3,9,.66),rgba(3,3,9,0))}
  #scrimBot{position:fixed;bottom:0;left:0;right:0;height:150px;z-index:7;pointer-events:none;
    background:linear-gradient(0deg,rgba(3,3,9,.60),rgba(3,3,9,0))}
  #vig{position:fixed;inset:0;z-index:6;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%,transparent 54%,rgba(2,2,6,.42) 100%)}

  /* ---------- HUD ---------- */
  .hud{position:fixed;z-index:10;pointer-events:none}

  #head{top:30px;right:32px;text-align:right;max-width:46vw}
  #head .kick{font-size:10px;letter-spacing:.36em;color:var(--red);font-weight:700;
    text-transform:uppercase}
  #head .kick::before{content:"—";color:#3A4160;margin-right:.7em;letter-spacing:0}
  #head h1{margin:9px 0 0;font-family:var(--serif);font-weight:500;
    font-size:clamp(17px,2.2vw,30px);letter-spacing:-.008em;line-height:1.14;
    text-shadow:0 2px 24px rgba(0,0,0,.55)}
  #head p{margin:8px 0 0;font-size:clamp(10.5px,1.02vw,13px);color:#A6ACBE;line-height:1.55;
    max-width:46ch;text-wrap:pretty}
  #head .kick,#head h1,#head p{transition:opacity .38s ease,transform .38s cubic-bezier(.16,1,.3,1)}
  #head.out .kick,#head.out h1,#head.out p{opacity:0;transform:translateY(-7px)}

  #foot{left:30px;bottom:24px;display:flex;align-items:center;gap:18px}
  #num{font-variant-numeric:tabular-nums;font-size:11.5px;letter-spacing:.18em;color:#6E7590}
  #num b{color:#fff;font-weight:700;font-size:14px;letter-spacing:.10em}
  #prog{width:clamp(140px,18vw,280px);height:2px;background:#181D30;position:relative;overflow:hidden;border-radius:2px}
  #prog::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,var(--indigo),var(--red));opacity:.14}
  #prog i{position:absolute;inset:0;width:0;
    background:linear-gradient(90deg,var(--indigo-hi),var(--red));
    box-shadow:0 0 12px rgba(237,31,44,.8);
    transition:width .85s cubic-bezier(.4,0,.2,1)}

  #nav{right:30px;bottom:22px;display:flex;gap:8px;align-items:center;pointer-events:auto}
  #nav button{width:9px;height:9px;padding:0;border:0;border-radius:50%;cursor:pointer;
    background:#232941;transition:all .35s ease;position:relative}
  #nav button::after{content:"";position:absolute;inset:-5px;border-radius:50%;
    border:1px solid transparent;transition:border-color .3s ease}
  #nav button:hover::after{border-color:rgba(207,217,223,.35)}
  #nav button[aria-current="true"]{background:var(--red);width:28px;border-radius:5px;
    box-shadow:0 0 10px rgba(237,31,44,.65)}
  #nav button:hover{background:#454E75}
  #nav button[aria-current="true"]:hover{background:var(--red)}

  #fs{right:32px;bottom:64px;display:flex;pointer-events:auto}
  #fs button{width:34px;height:34px;border:1px solid rgba(207,217,223,.18);border-radius:9px;
    background:rgba(10,12,22,.55);color:#9AA0B8;cursor:pointer;font-size:13px;line-height:1;
    transition:all .3s ease;backdrop-filter:blur(4px)}
  #fs button:hover{color:#fff;border-color:rgba(237,31,44,.6);background:rgba(237,31,44,.14)}

  #hint{left:50%;bottom:24px;transform:translateX(-50%);font-size:9.5px;letter-spacing:.26em;
    color:#565E78;transition:opacity .7s ease;animation:hintPulse 2.6s ease-in-out infinite}
  #hint.gone{opacity:0;animation:none}
  @keyframes hintPulse{0%,100%{opacity:.55}50%{opacity:1}}

  /* ---------- loader ---------- */
  #load{position:fixed;inset:0;z-index:50;display:grid;place-content:center;gap:18px;justify-items:center;
    background:radial-gradient(ellipse at 50% 42%,#0A0C18 0%,#040409 68%);
    text-align:center;padding:24px;transition:opacity .9s ease}
  #load.hide{opacity:0;pointer-events:none}
  #load .t{font-family:var(--serif);font-size:15px;letter-spacing:.20em;font-weight:500;
    background:linear-gradient(92deg,#F4F6FF 30%,#ED1F2C 55%,#8FA0E8 75%);
    background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:#fff;animation:shine 2.6s linear infinite}
  @keyframes shine{0%{background-position:120% 0}100%{background-position:-120% 0}}
  #load .s{font-size:8.5px;letter-spacing:.42em;color:#565E78;margin-top:-8px}
  #load .b{width:210px;height:2px;background:#151A2C;overflow:hidden;border-radius:2px;margin:4px auto 0}
  #load .b i{display:block;height:100%;width:36%;border-radius:2px;
    background:linear-gradient(90deg,var(--indigo-hi),var(--red));
    box-shadow:0 0 10px rgba(237,31,44,.7);
    animation:sweep 1.15s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
  #load .err{color:#98A0B8;font-size:12px;max-width:54ch;line-height:1.7;display:none;margin-top:6px}
  #load .err b{color:#fff;font-weight:600}
  #load .err code{background:rgba(255,255,255,.09);padding:2px 6px;border-radius:4px;font-size:11px;color:#C9D2FF}
  @media (max-width:720px){
    #head{max-width:60vw}#hint{display:none}
    :root{--lb:34px}#fs{display:none}
  }
</style>
</head>
<body>

<div id="stage"></div>

<div class="lb" id="lbT"></div>
<div class="lb" id="lbB"></div>
<div id="scrimTop"></div>
<div id="scrimBot"></div>
<div id="vig"></div>

<div class="hud" id="head">
  <div class="kick" id="kick"></div>
  <h1 id="h1"></h1>
  <p id="hp"></p>
</div>

<div class="hud" id="foot">
  <div id="num"><b>01</b> / 10</div>
  <div id="prog"><i></i></div>
</div>
<div class="hud" id="nav"></div>
<div class="hud" id="fs"><button id="fsBtn" aria-label="Toggle fullscreen" title="Fullscreen (F)">⛶</button></div>
<div class="hud" id="hint">ARROWS OR SPACE TO MOVE</div>

<div id="load">
  <div class="t">BUE · FCMM</div>
  <div class="s">MASS COMMUNICATION AS A STUDENT-RUN MEDIA OUTLET</div>
  <div class="b"><i></i></div>
  <div class="err" id="lerr"></div>
</div>

<script>
(function(){
  var el=document.getElementById('lerr');
  var stage=document.getElementById('stage');
  window.__BOOTED__=false;
  window.__fail=function(html){
    if(window.__BOOTED__||!el) return;
    el.innerHTML=html;
    el.style.display='block';
    var l=document.getElementById('load');
    if(l) l.classList.remove('hide');
    var t=document.querySelector('#load .b');
    if(t) t.style.display='none';
  };

  if(location.protocol==='file:'){
    stage.innerHTML='';
    window.__fail('<b>Serve this over HTTP.</b><br>Browsers block ES modules on <code>file://</code>.<br><br>'+
      'From this folder run:<br><code>python -m http.server 8000</code><br>'+
      'then open <code>http://localhost:8000</code><br><br>'+
      'On GitHub Pages it works as soon as the site is published.');
    return;
  }

  window.addEventListener('error',function(e){
    if(window.__BOOTED__) return;
    var why=(e&&e.message)?String(e.message):'';
    if(why&&!/Failed to load|net::/.test(why)) why='<br><span style="opacity:.7">'+why.replace(/[<>&]/g,'')+'</span>';
    else why='';
    window.__fail('<b>The 3D engine could not start.</b>'+why+'<br><br>'+
      'Check that <code>three.module.js</code>, <code>core.js</code> and <code>deck.js</code> all sit next to <code>index.html</code>.');
  },true);

  setTimeout(function(){
    if(window.__BOOTED__) return;
    var webgl=false;
    try{
      var c=document.createElement('canvas');
      webgl=!!(c.getContext('webgl2')||c.getContext('webgl'));
    }catch(err){}
    window.__fail(webgl
      ? '<b>Still starting.</b><br>The files loaded but the scene did not finish. Try reloading.'
      : '<b>WebGL is unavailable.</b><br>Enable hardware acceleration in your browser settings, then reload.');
  },12000);
})();
</script>

<script type="module" src="./deck.js"></script>

</body>
</html>
